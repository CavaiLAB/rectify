apiVersion: apps/v1
kind: Deployment
metadata:
  name: rectify
  labels:
    app.kubernetes.io/name: rectify
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rectify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rectify
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: qd
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rectify
          image: rectify
          imagePullPolicy: IfNotPresent
          command: [node, --import, tsx, server/index.ts]
          ports:
            - name: http
              containerPort: 3188
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3188"
            - name: DATA_DIR
              value: /app/data
            - name: COOKIE_SECURE
              value: "true"
            - name: TRUSTED_PROXIES
              value: 10.77.0.1/32
            - name: ATTACHMENT_STORAGE
              value: oss
            - name: OSS_BUCKET
              value: deepsingularity-rectify-attachments-20261029
            - name: OSS_REGION
              value: oss-cn-hangzhou
            - name: OSS_ACCESS_KEY_ID_FILE
              value: /var/run/secrets/rectify-oss/access-key-id
            - name: OSS_ACCESS_KEY_SECRET_FILE
              value: /var/run/secrets/rectify-oss/access-key-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            - name: oss-credentials
              mountPath: /var/run/secrets/rectify-oss
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rectify-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: oss-credentials
          secret:
            secretName: rectify-oss-storage
            defaultMode: 288 # 0440，避免 YAML 版本导致八进制歧义
