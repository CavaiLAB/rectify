apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rectify-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rectify
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.77.0.1/32
        - ipBlock:
            cidr: 192.168.1.161/32
      ports:
        - protocol: TCP
          port: 3188
