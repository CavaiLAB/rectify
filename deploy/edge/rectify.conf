server {
    listen 80;
    listen [::]:80;
    server_name rec.deepsingularity.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rec.deepsingularity.cn;
    ssl_certificate /etc/letsencrypt/live/rec.deepsingularity.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rec.deepsingularity.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 52m;

    location / {
        proxy_pass http://192.168.1.213:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
    }
}
