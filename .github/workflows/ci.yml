name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rectify:test .
      - name: 检查容器启动和接口
        run: |
          docker run -d --name rectify-test -p 127.0.0.1:3188:3188 rectify:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3188/api/health; then exit 0; fi
            sleep 1
          done
          docker logs rectify-test
          exit 1
